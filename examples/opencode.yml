name: OpenCode

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for OpenCode
        required: true
        default: Add a short "Project layout" section to the README.

permissions:
  contents: write
  pull-requests: write

jobs:
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./
        with:
          model: openrouter/anthropic/claude-sonnet-5.5
          prompt: ${{ inputs.prompt }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "OpenCode made no changes."
            exit 0
          fi

          branch="opencode/${{ github.run_id }}"
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: apply OpenCode changes"
          git push origin "$branch"
          gh pr create \
            --title "OpenCode: ${{ inputs.prompt }}" \
            --body "Generated by OpenCode in run ${{ github.run_id }}." \
            --head "$branch"
