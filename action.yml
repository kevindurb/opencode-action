name: OpenCode
description: Run the OpenCode coding agent non-interactively in GitHub Actions.
author: kevindurb

branding:
  icon: terminal
  color: orange

inputs:
  prompt:
    description: Prompt to send to OpenCode.
    required: true
  model:
    description: Model to use, in `provider/model#variant` form, for example `openrouter/anthropic/claude-sonnet-5.5`. Defaults to the model from the OpenCode config.
    required: false
  agent:
    description: Agent to use, for example `build` or `plan`.
    required: false
  version:
    description: OpenCode version to install, `latest` for the newest release, or `none` to use an `opencode` already on PATH.
    required: false
    default: latest
  working-directory:
    description: Directory to run OpenCode in, relative to the workspace.
    required: false
    default: .
  auto:
    description: Auto-approve permissions that are not explicitly denied. Required for unattended tool use.
    required: false
    default: "true"
  args:
    description: Extra arguments appended to `opencode run`, for example `--title "nightly docs"`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install OpenCode
      if: inputs.version != 'none'
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        installer="$RUNNER_TEMP/opencode-install.sh"
        curl -fsSL https://opencode.ai/v2/install -o "$installer"

        if [ "$OPENCODE_VERSION" = "latest" ]; then
          bash "$installer" --no-modify-path
        else
          bash "$installer" --no-modify-path --version "$OPENCODE_VERSION"
        fi

        # The installer drops the binary under ~/.opencode/bin. Make it
        # available to later steps without editing shell rc files.
        echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
        "$HOME/.opencode/bin/opencode" --version

    - name: Run OpenCode
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OPENCODE_PROMPT: ${{ inputs.prompt }}
        OPENCODE_MODEL: ${{ inputs.model }}
        OPENCODE_AGENT: ${{ inputs.agent }}
        OPENCODE_AUTO: ${{ inputs.auto }}
        OPENCODE_EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        args=(run)

        if [ "$OPENCODE_AUTO" = "true" ]; then
          args+=(--auto)
        fi

        if [ -n "$OPENCODE_MODEL" ]; then
          args+=(--model "$OPENCODE_MODEL")
        fi

        if [ -n "$OPENCODE_AGENT" ]; then
          args+=(--agent "$OPENCODE_AGENT")
        fi

        if [ -n "$OPENCODE_EXTRA_ARGS" ]; then
          # Deliberate word splitting so users can pass several flags.
          # shellcheck disable=SC2206
          args+=($OPENCODE_EXTRA_ARGS)
        fi

        opencode "${args[@]}" "$OPENCODE_PROMPT"
